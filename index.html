<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1714" />
    <title>Sudoku</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="boot">
      <div class="boot-card">
        <h1>Sudoku</h1>
        <p>Setting the board…</p>
      </div>
    </div>

    <main class="app">
      <header class="top">
        <h1>Sudoku</h1>
        <div class="meta">
          <span id="timer">0:00</span>
          <span id="solved">0 solved</span>
        </div>
      </header>

      <div class="levels" role="tablist" aria-label="Difficulty">
        <button type="button" data-difficulty="mini">4×4</button>
        <button type="button" data-difficulty="easy" aria-pressed="true">Easy</button>
        <button type="button" data-difficulty="medium">Medium</button>
        <button type="button" data-difficulty="hard">Hard</button>
      </div>

      <p id="status" class="status">Fill the grid. Each row, column, and box uses every number once.</p>

      <div class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="Sudoku board"></div>
      </div>

      <p id="pad-hint" class="pad-hint">Tap a cell, then a number to fill it.</p>
      <div id="nums" class="nums" aria-label="Numbers"></div>

      <div class="tools">
        <button type="button" id="notes-btn" aria-pressed="false" aria-describedby="pad-hint">
          <span class="tool-kicker">Pencil</span>
          <span class="tool-rest">notes</span>
        </button>
        <button type="button" id="erase-btn">Erase</button>
        <button type="button" id="hint-btn">Hint</button>
        <button type="button" id="check-btn">Check</button>
      </div>
      <button type="button" id="new-btn" class="icon-btn full-btn">New puzzle</button>
    </main>

    <div id="win" class="win-overlay" role="dialog" aria-labelledby="win-title">
      <div class="win-card">
        <h2 id="win-title">Solved</h2>
        <p id="win-copy"></p>
        <button type="button" id="win-again">Another puzzle</button>
      </div>
    </div>

    <!-- Local play must not wait on YouTube. The SDK is still loaded for later Playables cert. -->
    <script src="https://www.youtube.com/game_api/v1" async></script>
    <script src="js/playables.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
